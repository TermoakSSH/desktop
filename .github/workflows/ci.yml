name: CI

# Public repository: GitHub Actions minutes are free. The same locally:
#   cargo fmt --check && cargo build --locked && cargo test --locked
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Desktop app (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Toolchain pinned by rust-toolchain.toml
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libasound2-dev
      - name: Format
        run: cargo fmt --check
      - name: Tests
        run: cargo test --locked
